[package]
name = "aria-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.92"

[package.metadata]
cargo-fuzz = true

[dependencies]
aria-core = { path = "../crates/aria-core" }
aria-models = { path = "../crates/aria-models" }
libfuzzer-sys = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9"

[[bin]]
name = "project_json"
path = "fuzz_targets/project_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rational_json"
path = "fuzz_targets/rational_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_toml"
path = "fuzz_targets/catalog_toml.rs"
test = false
doc = false
bench = false

[workspace]
