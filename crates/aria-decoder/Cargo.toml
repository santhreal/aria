[package]
name = "aria-decoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-native video decoding behind the aria-core VideoDecoder trait. AVFoundation on Apple, Media Foundation on Windows, MediaCodec on Android, GStreamer on Linux."

[dependencies]
aria-core = { path = "../aria-core" }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Portable still-image decode (PNG/JPEG), pure Rust. Compiled on every
# platform: it is the primary path where no native image codec is wired
# (Windows/Android/Linux hosts) and the fallback behind ImageIO on Apple.
# `png` is pinned to the same 0.17 line aria-render already uses.
png = "0.17"
zune-jpeg = "0.5"
# Portable animated-sticker decode: GIF frames (APNG rides on `png` above).
gif = "0.14"
# Lottie vector animation: velato parses + replays draw calls; vello_cpu
# rasterizes them (pure Rust, SIMD — the GPU stays with the compositor).
# velato's optional `vello` feature would drag in wgpu; off. kurbo/peniko
# pinned to the lines both crates share so sink types unify.
velato = { version = "0.10", default-features = false }
vello_cpu = "0.0.9"
kurbo = "0.13"
peniko = "0.6"

# Apple backend: AVFoundation reader (demux + VideoToolbox decode) producing
# IOSurface-backed CVPixelBuffers. objc2 framework crates are pinned to the same
# 0.3.2 / objc2 0.6 line the renderer uses so the CVPixelBuffer / Metal types
# unify across the decode->compositor handoff. Default features are left on:
# they pull the full class set (and the cross-framework CoreMedia/CoreVideo
# glue the reader's CMSampleBuffer/CVPixelBuffer methods need); trim later if
# build time warrants.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
# Still-image decode via ImageIO (CGImageSource): covers HEIC/HEIF, WebP,
# GIF, TIFF, BMP on top of PNG/JPEG, honoring EXIF orientation.
objc2-image-io = "0.3.2"
objc2-core-graphics = "0.3.2"
# `objc2-core-media` / `objc2-core-video` features turn on the AVFoundation
# methods that return CMSampleBuffer / CVImageBuffer (e.g. copyNextSampleBuffer),
# which aren't in the default set.
objc2-av-foundation = { version = "0.3.2", features = [
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"

# Windows backend: Media Foundation Source Reader (demux + decode). With a
# D3D11 device manager attached the reader loads *hardware* decoder MFTs
# (DXVA); CPU output reads planes back through IMF2DBuffer, GPU output shares
# NV12 textures across to the renderer. The `windows` crate gives COM
# ergonomics (RAII release, `.cast()`, `Result<HRESULT>`) that raw
# `windows-sys` lacks, which matters for the COM-heavy MF surface.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

# Scrub seek cost, cold and warm, over the committed fixture clip.
[[bench]]
name = "seek_latency"
harness = false

# Android backend: NDK MediaExtractor (demux) + MediaCodec (hardware decode).
# We use the raw `ndk-sys` FFI rather than the safe `ndk` wrapper because `ndk`
# 0.9 exposes MediaCodec/MediaFormat but *not* MediaExtractor, so mixing the two
# leaves a wrapper gap at the demuxer; one raw type universe is cleaner. Bindings
# are pre-generated per-arch, so this checks without invoking bindgen.
[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.6", features = ["media"] }

# Linux backend: GStreamer uridecodebin (system plugins: VAAPI/NVDEC/V4L2,
# then software). Official crates against GStreamer 1.24.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = { version = "0.23", features = ["v1_24"] }
gstreamer-audio = "0.23"
gstreamer-pbutils = "0.23"
glib = "0.20"
# The open-file limit a decoding process raises (`gst_fds`).
rustix = { version = "1.1", features = ["process"] }
# `_exit` for `exit_process`.
libc = "0.2"

[lints]
workspace = true
