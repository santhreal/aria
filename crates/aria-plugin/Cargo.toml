[package]
name = "aria-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plugin host framework for Aria: service registry, typed events, and plugin lifecycle."

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = { workspace = true }
aria-core = { path = "../aria-core" }
aria-compositor = { path = "../aria-compositor" }
aria-commands = { path = "../aria-commands" }
aria-engine = { path = "../aria-engine" }
aria-models = { path = "../aria-models" }
aria-render = { path = "../aria-render" }
serde_json = { workspace = true }
# Loading an external plugin means dlopen; there is no other mechanism.
libloading = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Writes the tones the audio effect tests mix, through the export's own sink.
aria-encoder = { path = "../aria-encoder" }

[lints]
workspace = true
