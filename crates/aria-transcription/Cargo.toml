[package]
name = "aria-transcription"
description = "Offline Whisper transcription and verified on-demand model management for Aria"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cap-std = "4"
aria-analysis = { path = "../aria-analysis" }
aria-cloud = { path = "../aria-cloud" }
parking_lot.workspace = true
same-file = "1"
sha2 = "0.10"
thiserror.workspace = true
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", default-features = false }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
