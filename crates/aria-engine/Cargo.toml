[package]
name = "aria-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Aria editing engine: structured commands with inverse undo/redo over the project timeline."
# Test, benchmark, and example autodiscovery stay disabled so only the explicit
# targets below enter workspace gates.
# Test binaries are declared explicitly: oversized test files are split into
# `<name>_<concern>.rs` siblings that are `#[path]` modules of their parent, not
# standalone binaries. Autodiscovery would compile each sibling on its own.
autotests = false
autobenches = false
autoexamples = false

[dependencies]
# The GPU device a filmstrip cell renderer shares with the session's renderer;
# the drift guard tests read its pass descriptors.
aria-compositor = { path = "../aria-compositor" }
aria-core = { path = "../aria-core" }
aria-commands = { path = "../aria-commands" }
aria-decoder = { path = "../aria-decoder" }
aria-models = { path = "../aria-models" }
aria-render = { path = "../aria-render" }
dunce = "1"
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Apple-only: synthesize a real mp4 in tests so native import/probe is exercised
# without a checked-in fixture.
aria-encoder = { path = "../aria-encoder" }
tempfile = "3"
# Still-import tests write their own PNG fixture (same codec the decoder's
# portable path reads).
png = "0.17"
# The registry conformance test retargets a census command onto real fixture
# ids through its own wire form, so it needs no per-variant rewrite table.
serde_json.workspace = true
# What one command costs on a project of 480 clips.
criterion = { version = "0.5", features = ["html_reports"] }

[package.metadata.cargo-machete]
# Used by the explicitly declared benchmark targets below.
ignored = ["criterion"]

# Per-command cost: a parameter edit, an undo round trip, a split, a lane move.
[[bench]]
name = "command_apply"
harness = false

# Export and preview benches remain compile-checked even when not executed.
[[bench]]
name = "export"
harness = false

[[bench]]
name = "preview"
harness = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true