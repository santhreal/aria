[package]
name = "aria-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Aria render bridge: resolve a project timeline into composited frames and export them to video."
# Test binaries are declared explicitly: oversized test files are split into
# `<name>_<concern>.rs` siblings that are `#[path]` modules of their parent, not
# standalone binaries. Autodiscovery would compile each sibling on its own.
autotests = false

[dependencies]
aria-core = { path = "../aria-core" }
aria-models = { path = "../aria-models" }
aria-compositor = { path = "../aria-compositor" }
aria-decoder = { path = "../aria-decoder" }
aria-encoder = { path = "../aria-encoder" }
aria-shapes = { path = "../aria-shapes" }
aria-text = { path = "../aria-text" }
parking_lot = { workspace = true }
thiserror.workspace = true
tracing.workspace = true
png = "0.17"
nnnoiseless = "0.5"
tempfile = "3"
qoi = "0.4.1"
sha2 = "0.10.9"
# The `lut-pack` baker bin writes the starter-pack `luts.json` catalog.
serde_json.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
aria-compositor = { path = "../aria-compositor" }
aria-core = { path = "../aria-core" }
aria-models = { path = "../aria-models" }
# The zero-copy parity test inspects the adapter backend to skip on non-Metal
# (software) hosts where the Apple import path doesn't apply.
wgpu = { workspace = true }
# The steady-frame allocation test brings up a device of its own.
pollster = { workspace = true }

[[bench]]
name = "resolve"
harness = false

[[bench]]
name = "export_audio_mix"
harness = false

[[bench]]
name = "text_anim"
harness = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
