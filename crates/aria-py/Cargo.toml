[package]
name = "aria-py"
version = "0.5.3-alpha.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/santhreal/aria"
description = "Python bindings for the Aria video engine: a MoviePy-style API over the Rust timeline/render/export pipeline."
publish = false

# Its own workspace root. The crate sits outside the editor's workspace on
# purpose — the extension module links against CPython and would drag that
# choice into every other crate's build — and the tree above this one is another
# workspace, which would otherwise claim the package and refuse to build it.
[workspace]

[lib]
# Python import name is `aria`. cdylib for the extension module; rlib so the
# crate can also be checked/tested with plain `cargo`.
name = "aria"
crate-type = ["cdylib", "rlib"]

[dependencies]
aria-decoder = { path = "../aria-decoder" }
aria-models = { path = "../aria-models" }
aria-render = { path = "../aria-render" }
numpy = "0.29.0"
pyo3 = { version = "0.29.0" }

[build-dependencies]
# Emits the macOS `-undefined dynamic_lookup` link args for the cdylib. The
# `.cargo/config.toml` copy of these flags only applies when cargo runs from
# inside this directory; sdist builds (pip → maturin) run cargo from the sdist
# root, so the flags must come from the build script to link there.
pyo3-build-config = "0.29.0"

[package.metadata.cargo-machete]
# Used from build.rs; source-only dependency scanners do not inspect build scripts.
ignored = ["pyo3-build-config"]

[features]
# `cargo test` and `cargo build` link against an interpreter, so the crate's
# own tests run with no flags. The wheel is the other build: it borrows
# CPython's symbols instead of linking them, and asks for `extension-module`
# through `[tool.maturin]` in `pyproject.toml`. The two are mutually exclusive,
# which is why the shipped build is the one that names its feature.
default = ["embedded-python"]
extension-module = ["pyo3/extension-module"]
# An interpreter to link against.
embedded-python = ["pyo3/auto-initialize"]
