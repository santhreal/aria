[package]
name = "aria-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Aria GPUI viewport: theme, motion, shell, and editor panels."

[lib]
name = "aria_ui"
path = "src/lib.rs"

# The one integration test: the shell, drawn in a headless window. A crate-root
# file rather than a `tests/` directory, so the path is declared here.
[[test]]
name = "shell"
path = "tests_shell.rs"

[dependencies]
gpui = { workspace = true }
gpui_platform = { workspace = true }
aria-engine = { path = "../aria-engine" }
aria-models = { path = "../aria-models" }
aria-commands = { path = "../aria-commands" }
aria-render = { path = "../aria-render" }
aria-compositor = { path = "../aria-compositor" }
aria-core = { path = "../aria-core" }
aria-plugin = { path = "../aria-plugin" }
aria-storage = { path = "../aria-storage" }
aria-settings = { path = "../aria-settings" }
aria-decoder = { path = "../aria-decoder" }
aria-encoder = { path = "../aria-encoder" }
aria-text = { path = "../aria-text" }
aria-shapes = { path = "../aria-shapes" }
aria-cloud = { path = "../aria-cloud" }
aria-analysis = { path = "../aria-analysis", features = ["sqlite"] }
aria-detect = { path = "../aria-detect" }
aria-jobs = { path = "../aria-jobs" }
aria-transcription = { path = "../aria-transcription" }
aria-ai = { path = "../aria-ai" }
image = { version = "0.25", default-features = false }
smallvec = "1"
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
tracing = { workspace = true }
parking_lot = { workspace = true }
# No `rfd` here on purpose. Its blocking dialog calls freeze the window until
# the dialog is answered, so they live in `aria-dialog`, which offers futures
# only. `app::picker` is the one module that calls it.
aria-dialog = { path = "../aria-dialog" }
cpal = "0.15"
# Job threads still hand results over a blocking channel; the window's tasks
# never wait on one. See `handoff`.
crossbeam-channel = "0.5"
async-channel = "2"

[dev-dependencies]
# `test-support` gives tests a headless `TestAppContext`, which is the only way
# to build the `Context<AppState>` a menu item takes. Without it, the menu bar —
# seventy-nine operator surfaces — is untestable by construction.
gpui = { workspace = true, features = ["test-support"] }
criterion = { version = "0.5", features = ["html_reports"] }
# `handoff` is awaited without a window in its own unit tests.
pollster = { workspace = true }

# The hot paths a frame pays for outside the GPU: projecting the project into
# the view model, building the magnet index from it, and querying that index
# once per pointer move. A crate-root file, like the shell test above, so no
# directory is implied.
[[bench]]
name = "ui_hot_paths"
path = "bench_hot_paths.rs"
harness = false

[lints]
workspace = true
