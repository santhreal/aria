# Animation presets: which named animations exist, what slot each belongs to, and
# which knobs the UI offers for it.
#
# `id` selects a curve the renderer implements; an id with no implementation
# animates nothing. `slot` is `in`, `out`, or `combo`. `text_only` presets are
# offered on text clips only. `stagger` applies per character, so it is only
# meaningful for the `char_` presets.
#
# Copy this file to <data dir>/catalogs/animations.toml to change the set.

[[entry]]
id = "fade_in"
label = "Fade in"
slot = "in"

[[entry]]
id = "slide_up"
label = "Slide up"
slot = "in"

