# Named cubic-bezier easings offered in the keyframe flyout.
#
# `points` are the control points (x1, y1, x2, y2). x stays in 0 … 1; y outside
# that overshoots, the same as CSS. Multi-keyframe bounce and elastic are not
# beziers and are not in this file.
#
# An easing is stored on a keyframe as its curve, not as its id, so renaming an
# id here does not change animation that already used it.
#
# Copy this file to <data dir>/catalogs/easings.toml to change the set.

[[entry]]
id = "snappy"
label = "Snappy"
# Material standard decelerate — quick start, crisp settle.
points = [0.0, 0.0, 0.2, 1.0]

[[entry]]
id = "overshoot"
label = "Overshoot"
# Slight y > 1 for a soft landing past the target.
points = [0.34, 1.56, 0.64, 1.0]

[[entry]]
id = "anticipate"
label = "Anticipate"
# Slight y < 0 wind-up before the motion.
points = [0.36, 0.0, 0.66, -0.56]
