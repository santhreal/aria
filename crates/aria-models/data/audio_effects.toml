  { name = "feedback", label = "Feedback", default = 0.35, min = 0.0, max = 0.95 },
  { name = "mix", label = "Mix", default = 0.35, min = 0.0, max = 1.0 },
]

[[entry]]
id = "pitch_shifter"
label = "Pitch Shifter"
latency = 1024
params = [
  { name = "semitones", label = "Semitones", default = 0.0, min = -12.0, max = 12.0 },
  { name = "cents", label = "Cents", default = 0.0, min = -100.0, max = 100.0 },
]

[[entry]]
id = "swap_channels"
