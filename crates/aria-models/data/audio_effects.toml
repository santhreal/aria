  { name = "damping", label = "Damping", default = 0.5, min = 0.0, max = 1.0 },
  { name = "width", label = "Width", default = 1.0, min = 0.0, max = 1.0 },
  { name = "mix", label = "Mix", default = 0.25, min = 0.0, max = 1.0 },
  { name = "predelay", label = "Pre-delay (ms)", default = 0.0, min = 0.0, max = 200.0 },
]

[[entry]]
id = "delay"
label = "Delay"
