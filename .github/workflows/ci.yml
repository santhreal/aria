name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Debuginfo is the biggest memory/disk consumer when linking the desktop app,
  # CLI, and Criterion benches (--all-targets). The hosted runner has been
  # OOM-killed ("runner received a shutdown signal", exit 143) with full debug;
  # CI never inspects binaries in a debugger, so drop it. Release jobs are
  # unaffected (release profile).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: build / test / clippy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Linux media uses GStreamer, and the export tests encode through x264enc
      # (plugins-ugly). fontconfig, xkbcommon and ALSA support GPUI text, keys
      # and cpal audio; Vulkan gives wgpu a headless adapter for compositor tests.
      - name: Install system development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            mesa-vulkan-drivers libvulkan1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@v0.9.2


      - name: Format
        run: cargo --locked fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Compile benchmarks
        run: cargo bench --workspace --no-run --locked

      - name: Test
        run: cargo test --workspace --locked

  coverage:
    name: contract crate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-contracts

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce the contract coverage floor
        run: >-
          cargo llvm-cov
          --package aria-core
          --package aria-models
          --package aria-commands
          --locked
          --fail-under-lines 85

  fuzz:
    name: untrusted parser fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Compile every fuzz target
        run: cargo +nightly --locked fuzz build --fuzz-dir fuzz

  semver:
    name: public API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"

      - name: Resolve the API baseline
        id: api-baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_SHA:crates/aria-core/Cargo.toml"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$BASE_SHA" = "22437e2837340c7c57d62e438117f9a0fb4096d2" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "The pull request base has no aria-core contract crate." >&2
            exit 1
          fi

      # The pinned base is the intentional Cutlass-to-Aria package rename. It
      # has no aria-* package identity to compare. Every later base must have
      # the contract crates and pass the action below.
      - name: Accept the pinned package-rename baseline
        if: steps.api-baseline.outputs.available == 'false'
        run: echo "The pinned pre-Aria package identity is the explicit baseline exception."

      - name: Check contract crates against the pull request base
        if: steps.api-baseline.outputs.available == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: aria-core, aria-models, aria-commands
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          rust-toolchain: manual
          release-type: minor

  msrv:
    name: rust 1.97 workspace check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Check every target at the minimum supported Rust version
        run: cargo +1.97 check --workspace --all-targets --locked

  mobile-targets:
    name: mobile / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-ios
          - os: ubuntu-latest
            target: aarch64-linux-android
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mobile-${{ matrix.target }}

      - name: Check the mobile bridge
        run: cargo check -p aria-mobile --target ${{ matrix.target }} --locked

  python-bindings:
    name: Python bindings smoke test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            bindings:
              - 'crates/aria-py/**'
              - 'crates/aria-core/**'
              - 'crates/aria-render/**'

      - name: Install system development libraries
        if: steps.changes.outputs.bindings == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.bindings == 'true'

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.bindings == 'true'
        with:
          python-version: '3.12'

      - uses: PyO3/maturin-action@v1
        if: steps.changes.outputs.bindings == 'true'
        with:
          working-directory: crates/aria-py
          args: --locked --out dist

      - name: Import the extension module
        if: steps.changes.outputs.bindings == 'true'
        working-directory: crates/aria-py
        run: |
          python -m pip install dist/*.whl
          python -c "import aria; print('aria', aria.__version__)"

  # Compile release binaries on every desktop platform and exercise the Linux
  # and Windows packagers. Tag builds repeat these steps before publication.
  build-linux:
    name: release package / linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            fontconfig libfontconfig1-dev \
            libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build aria-desktop (release)
        run: cargo build --release -p aria-desktop --locked

      - name: Package tarball
        run: chmod +x scripts/package-linux.sh && ./scripts/package-linux.sh

      - name: Verify package output
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(dist/Aria-*-linux-*.tar.gz)
          if [[ ${#artifacts[@]} -ne 1 ]]; then
            echo "Expected one Linux tarball, found ${#artifacts[@]}." >&2
            exit 1
          fi

  build-macos:
    name: release build / macos arm64
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build aria-desktop (release)
        run: cargo build --release -p aria-desktop --locked

  build-windows:
    name: release build / windows x86_64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build aria-desktop (release)
        run: cargo build --release -p aria-desktop --locked

      # Exercise the full Windows packaging path on PRs too: it's broken releases
      # before (e.g. the -Arch splatting bug) while compile-only CI stayed green.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package zip + installer
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1 -Arch x86_64
