[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is transitive through fontdb, rustybuzz, and GPUI; the advisory reports no safe upgrade" },
    { id = "RUSTSEC-2024-0375", reason = "atty is transitive through nnnoiseless and clap 3; no maintained nnnoiseless release is available" },
    { id = "RUSTSEC-2024-0436", reason = "paste is transitive through GStreamer 0.23; removal requires the planned GStreamer API migration" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is transitive through usvg in GPUI; the advisory reports no safe upgrade" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is transitive through zbus 5 in GPUI's accesskit, ashpd, atspi, and notify-rust; it merged into zbus 6, which none of them depend on, and the advisory reports no safe upgrade" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is transitive through zbus 5 in GPUI's accesskit, ashpd, atspi, and notify-rust; it merged into zbus 6, which none of them depend on, and the advisory reports no safe upgrade" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is transitive through zbus 5 in GPUI's accesskit, ashpd, atspi, and notify-rust; it merged into zbus 6, which none of them depend on, and the advisory reports no safe upgrade" },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 is transitive through ureq 2, which has no release on webpki-roots 1; 0.26.11 contains no roots and re-exports webpki-roots 1, which bans.deny holds at 1.0.10 or later" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "cbindgen"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "dwrote"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "option-ext"

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = [
    { crate = "webpki-roots:>=1.0.0,<1.0.10", reason = "RUSTSEC-2026-0381: releases before 1.0.10 include emSign ECC Root CA - G3" },
    { crate = "webpki-roots:<1.0.0", wrappers = ["ureq"], reason = "RUSTSEC-2026-0381 is ignored for the 0.26 shim that ureq 2 depends on, and for no other dependent" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/proptest-rs/proptest",
    "https://github.com/santhreal/santh-gpui",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs.git",
]
